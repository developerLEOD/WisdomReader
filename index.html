<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wisdom Reader by The Wisdom Lounge</title>
    <meta name="description" content="An editorial book summarizer and study studio for classical works and long texts, built for The Wisdom Lounge learning community." />
    <meta property="og:title" content="Wisdom Reader by The Wisdom Lounge" />
    <meta property="og:description" content="An editorial book summarizer and study studio for classical works and long texts, built for The Wisdom Lounge learning community." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Inter (UI), Cormorant Garamond & Lora (Book Serif), Cairo & Amiri (Arabic), Noto Nastaliq Urdu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <script>
      // Suppress harmless Vite WebSocket/HMR reconnection errors in the iframe preview
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('vite-hmr')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') || event.reason.stack?.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#FBF7EE] text-[#2A1E17] antialiased selection:bg-[#E8DDCB] selection:text-[#1F1610]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
